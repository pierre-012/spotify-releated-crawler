<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artistes Spotify</title>
<style>
:root{
  --bg:#0b0f0d;
  --panel:#141a17;
  --panel-2:#1b2320;
  --line:#26312c;
  --text:#eef5f1;
  --muted:#8fa399;
  --accent:#1ed760;
  --accent-soft:rgba(30,215,96,.14);
}
*{box-sizing:border-box}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  max-width:1200px;margin:0 auto;padding:32px 24px 60px;
  color:var(--text);
  background:
    radial-gradient(900px 400px at 85% -10%,rgba(30,215,96,.16),transparent 60%),
    radial-gradient(700px 350px at -10% 0%,rgba(30,215,96,.08),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  min-height:100vh;
}
header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap}
h1{
  margin:0 0 8px;font-size:34px;letter-spacing:-.02em;
  background:linear-gradient(90deg,#fff,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.controls{display:flex;gap:10px;min-width:380px;flex:1;max-width:560px}
input,select{
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);color:var(--text);font-size:14px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input{width:100%}
input::placeholder{color:var(--muted)}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:28px 0}
.card{
  background:linear-gradient(160deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:16px;padding:18px;
  transition:transform .15s,border-color .15s;
}
.card:hover{transform:translateY(-2px);border-color:rgba(30,215,96,.5)}
.card .small{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.value{font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.card:first-child .value{color:var(--accent)}
table{
  width:100%;border-collapse:separate;border-spacing:0;margin-top:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
}
th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left}
th{
  background:var(--panel-2);color:var(--muted);font-size:11px;
  text-transform:uppercase;letter-spacing:.08em;font-weight:600;
}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(30,215,96,.06)}
tr:last-child td{border-bottom:none}
a{
  color:var(--accent);text-decoration:none;font-weight:600;font-size:13px;
  padding:6px 12px;border:1px solid rgba(30,215,96,.4);border-radius:999px;
  transition:background .15s,color .15s;
}
a:hover{background:var(--accent);color:#04120a}
.small{color:var(--muted);font-size:13px}
.badge{
  display:inline-block;margin-left:8px;padding:3px 9px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:.06em;
  background:var(--accent-soft);color:var(--accent);
}
.empty{text-align:center;padding:48px;color:var(--muted)}
@media (max-width:700px){
  body{padding:20px 14px}
  .controls{min-width:0;width:100%;max-width:none}
  th,td{padding:10px}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Artistes Spotify</h1>
    <div class="small" id="last">Chargement…</div>
    <div class="small" id="files"></div>
  </div>
  <div class="controls">
    <select id="mode">
      <option value="all">Tous les artistes</option>
      <option value="new">Nouveaux (24 h)</option>
    </select>
    <input id="search" placeholder="Rechercher un artiste…">
  </div>
</header>

<section class="stats">
  <div class="card"><div class="small">Nouveaux artistes (24h)</div><div class="value" id="newCount">—</div></div>
  <div class="card"><div class="small">Total artistes</div><div class="value" id="totalCount">—</div></div>
  <div class="card"><div class="small">Parcourus</div><div class="value" id="processed">—</div></div>
  <div class="card"><div class="small">En attente</div><div class="value" id="queue">—</div></div>
  <div class="card"><div class="small">Erreurs</div><div class="value" id="errors">—</div></div>
</section>

<table>
  <thead>
    <tr><th>Artiste</th><th>ID</th><th>Auditeurs mensuels</th><th>Ajouté</th><th>Spotify</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="small" id="limit" style="margin-top:10px"></div>

<script>
const NEW_WINDOW_MS = 24 * 60 * 60 * 1000;
const MAX_ROWS = 500;      // limite d'affichage (il y a des dizaines de milliers d'artistes)
const MAX_FILES = 200;     // sécurité

let artists = {};
let state = {};
let fileNames = [];

const $ = id => document.getElementById(id);

async function fetchJson(path){
  const r = await fetch(path + '?' + Date.now());
  if(!r.ok) return null;
  return r.json();
}

// Charge artistes.json puis artistes_1.json, artistes_2.json... jusqu'au premier manquant
async function loadArtists(){
  const all = {};
  const names = [];

  const main = await fetchJson('data/artistes.json');
  if(!main) throw new Error('Impossible de charger data/artistes.json');
  Object.assign(all, main.artists || {});
  names.push('artistes.json');

  for(let i = 1; i <= MAX_FILES; i++){
    const name = 'artistes_' + i + '.json';
    let doc = null;
    try{ doc = await fetchJson('data/' + name); }catch(e){}
    if(!doc) break;
    Object.assign(all, doc.artists || {});
    names.push(name);
  }

  fileNames = names;
  return all;
}

async function load(){
  try{
    const [a, s] = await Promise.all([
      loadArtists(),
      fetchJson('data/state.json')
    ]);
    artists = a;
    state = s || {};
    render();
  }catch(error){
    console.error(error);
    $('last').textContent = 'Erreur : ' + error.message;
  }
}

function isNewArtist(artist){
  if(!artist.first_seen) return false;
  const t = new Date(artist.first_seen).getTime();
  if(Number.isNaN(t)) return false;
  const age = Date.now() - t;
  return age >= 0 && age <= NEW_WINDOW_MS;
}

function render(){
  const q = ($('search').value || '').toLowerCase();
  const mode = $('mode').value;
  const list = Object.values(artists);

  const newCount = list.filter(isNewArtist).length;

  let shown = mode === 'new' ? list.filter(isNewArtist) : list;

  shown = shown
    .filter(a =>
      (a.name || '').toLowerCase().includes(q) ||
      (a.id || '').toLowerCase().includes(q))
    .sort((a, b) => new Date(b.first_seen || 0) - new Date(a.first_seen || 0));

  $('newCount').textContent = newCount.toLocaleString('fr-FR');
  $('totalCount').textContent = list.length.toLocaleString('fr-FR');
  $('processed').textContent = (state.processed || []).length.toLocaleString('fr-FR');
  $('queue').textContent = (state.queue || []).length.toLocaleString('fr-FR');
  $('errors').textContent = (state.stats || {}).errors || 0;
  $('last').textContent = 'Dernière sauvegarde : ' + (state.last_run || '—');
  $('files').textContent = 'Fichiers chargés : ' + fileNames.join(', ');

  if(shown.length === 0){
    $('rows').innerHTML = '<tr><td colspan="5" class="empty">Aucun artiste trouvé.</td></tr>';
    $('limit').textContent = '';
    return;
  }

  const visible = shown.slice(0, MAX_ROWS);

  $('rows').innerHTML = visible.map(artist => `
    <tr>
      <td>
        <strong>${escapeHtml(artist.name || 'Sans nom')}</strong>
        ${isNewArtist(artist) ? '<span class="badge">NOUVEAU</span>' : ''}
      </td>
      <td class="small">${escapeHtml(artist.id || '')}</td>
      <td>${artist.monthly_listeners == null ? '—' : Number(artist.monthly_listeners).toLocaleString('fr-FR')}</td>
      <td class="small">${formatDate(artist.first_seen)}</td>
      <td><a href="${escapeAttr(artist.url || '#')}" target="_blank" rel="noopener">Ouvrir</a></td>
    </tr>`).join('');

  $('limit').textContent = shown.length > MAX_ROWS
    ? 'Affichage des ' + MAX_ROWS + ' premiers sur ' + shown.length.toLocaleString('fr-FR') + ' résultats. Utilise la recherche pour filtrer.'
    : shown.length + ' résultat(s)';
}

function formatDate(value){
  if(!value) return '—';
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function escapeAttr(s){
  return String(s).replace(/"/g, '&quot;');
}

$('search').addEventListener('input', render);
$('mode').addEventListener('change', render);

load();
setInterval(load, 60000);
</script>
</body>
</html>
