name: Filter Spotify Artists

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Appliquer les suppressions aux fichiers artistes JSON"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: spotify-artist-filter
  cancel-in-progress: false

jobs:
  filter:
    name: Vérifier et nettoyer les artistes
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Run artist filter
        env:
          HEADLESS: "1"
          SPOTIFY_LANGUAGE: "intl-fr"
          PAGE_WAIT_MS: "2500"
        run: |
          echo "=========================================="
          echo "Spotify Artist Filter"
          echo "=========================================="

          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "Mode: apply"
            python src/filter_artists.py --apply
          else
            echo "Mode: simulation"
            python src/filter_artists.py
          fi

          echo "=========================================="

      - name: Upload filter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotify-artist-filter-report
          path: data/artist_filter_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Show changes
        if: always()
        run: |
          echo "=========================================="
          echo "Git changes"
          echo "=========================================="

          git status --short
          git diff --stat

      - name: Commit and push changes
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Filter artists by activity and French language"

          echo "Fetching latest main..."
          git fetch origin main

          echo "Rebasing on latest main..."
          git rebase origin/main

          echo "Pushing..."
          git push origin HEAD:main
