name: Filter Spotify Artists

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-artist-filter
  cancel-in-progress: false

jobs:
  filter:
    name: Vérifier et nettoyer les artistes
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # ============================================================
      # FILTER
      # ============================================================

      - name: Run artist filter
        env:
          HEADLESS: "1"
          SPOTIFY_LANGUAGE: "intl-fr"
          PAGE_WAIT_MS: "2500"
        run: |
          echo "=========================================="
          echo "Spotify Artist Filter"
          echo "=========================================="
          echo "Mode: manual"
          echo "Spotify API: disabled"
          echo "Active: last release < 6 months"
          echo "French: > 60%"
          echo "=========================================="

          python src/filter_artists.py

      # ============================================================
      # REPORT
      # ============================================================

      - name: Upload filter report
        uses: actions/upload-artifact@v4
        with:
          name: spotify-artist-filter-report
          path: |
            data/artist_filter_report.json
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # SHOW CHANGES
      # ============================================================

      - name: Show changes
        run: |
          echo "=========================================="
          echo "Git changes"
          echo "=========================================="

          git status --short
          git diff --stat

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Filter artists by activity and French language"

          echo "Fetching latest main..."
          git fetch origin main

          echo "Rebasing on latest main..."
          git rebase origin/main

          echo "Pushing..."
          git push origin HEAD:main
